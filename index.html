<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立隼打卡</title>
<style>
  :root { --brand: #c62828; --ok: #1a7f37; --muted: #666; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif; background: #f6f6f6; color: #222; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px; text-align: center; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .kind { font-size: 40px; font-weight: bold; color: var(--brand); margin: 12px 0; }
  .clock { font-size: 18px; color: var(--muted); margin-bottom: 24px; }
  button { width: 100%; padding: 18px; font-size: 20px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; }
  button:disabled { opacity: .5; }
  button.second { margin-top: 16px; background: #fff; color: var(--brand); border: 2px solid var(--brand); }
  [hidden] { display: none !important; }
  #status { margin-top: 20px; font-size: 17px; line-height: 1.6; white-space: pre-line; }
  .ok { color: var(--ok); font-weight: bold; } .err { color: var(--brand); font-weight: bold; }
  img { max-width: 60%; border-radius: 8px; margin-top: 12px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main>
  <h1>立隼企業 打卡</h1>
  <div class="kind" id="kind">打卡</div>
  <div class="clock" id="clock"></div>
  <button id="go" disabled>拍照並打卡</button>
  <input id="camera" type="file" accept="image/*" capture="user">
  <img id="preview" alt="" hidden>
  <div id="status">載入中…</div>
  <button id="retry" class="second" hidden>重新定位</button>
  <button id="browser" class="second" hidden>改用手機瀏覽器打卡</button>
  <p style="margin-top:32px;font-size:12px;color:#aaa">打卡頁版本 5</p>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // 這兩個值不是密碼，可以公開：LIFF ID 是打卡頁的編號，網址是系統收打卡資料的地方
  const LIFF_ID = '2012265965-rSm3NPmt';
  const SYSTEM_URL = 'https://script.google.com/macros/s/AKfycbwLEQq3Lt85fpw-4gh_jIRwsUOjT54pgJnM0urmRW3o5adaHWmzQs6q36Lzb8glUUv1/exec';
  const KINDS = { 上班: '上班打卡', 下班: '下班打卡', 外出: '中午外出', 回來: '中午回來' };

  const $ = (id) => document.getElementById(id);
  const kind = new URLSearchParams(location.search).get('kind') || '上班';
  $('kind').textContent = KINDS[kind] || '打卡';
  setInterval(() => { $('clock').textContent = new Date().toLocaleString('zh-TW', { hour12: false }); }, 1000);

  function show(text, cls) { $('status').className = cls || ''; $('status').textContent = text; }

  // 先定位、再拍照：定位成功才開放拍照按鈕，員工不用拍完照才發現定位失敗
  const LOCATION_HELP = '\n\n請檢查手機設定：\niPhone：設定 → 隱私權與安全性 → 定位服務要打開；設定 → LINE → 位置 → 選「使用 App 期間」並打開「精確位置」\nAndroid：設定 → 應用程式 → LINE → 權限 → 位置 → 允許';
  const ERROR_NAMES = { 1: '沒有權限', 2: '手機無法定位', 3: '定位逾時' };
  let lastPos = null, posError = null, watchId = null;
  function keepBest(p) { if (!lastPos || p.coords.accuracy <= lastPos.coords.accuracy || Date.now() - lastPos.timestamp > 30000) lastPos = p; posError = null; }
  function keepError(e) { posError = e; }

  /** 向手機要定位：高精準＋粗略兩種同時要，哪個先回來先用 */
  function requestLocation() {
    if (!navigator.geolocation) return;
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(keepBest, keepError, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    navigator.geolocation.getCurrentPosition(keepBest, keepError, { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 });
  }

  /** 等定位：準度夠就馬上用；5 秒後有定位就直接用；最多等 10 秒，不會無限卡住 */
  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('這支手機不支援定位' + LOCATION_HELP));
      const started = Date.now();
      (function wait() {
        const sec = Math.floor((Date.now() - started) / 1000);
        if (lastPos && lastPos.coords.accuracy <= 100) return resolve(lastPos);
        if (lastPos && sec >= 5) return resolve(lastPos);
        if (posError && posError.code === 1) return reject(new Error('LINE 沒有取得位置的權限。' + LOCATION_HELP));
        if (sec >= 10) {
          const why = posError ? '（' + (ERROR_NAMES[posError.code] || '代碼 ' + posError.code) + '）' : '（手機沒有回應）';
          return reject(new Error('抓不到手機定位' + why + '。' + LOCATION_HELP));
        }
        show('正在取得手機定位…（' + sec + ' 秒）');
        setTimeout(wait, 300);
      })();
    });
  }

  /** 開啟頁面後先定位；成功才顯示拍照按鈕，失敗就提供「改用 Safari／瀏覽器打卡」 */
  async function locate() {
    $('go').disabled = true; $('retry').hidden = true; $('browser').hidden = true;
    requestLocation();
    try {
      const pos = await getPosition();
      show('定位完成 ✓（誤差約 ' + Math.round(pos.coords.accuracy) + ' 公尺）\n請按下方按鈕，拍一張自己的照片完成打卡。', 'ok');
      $('go').disabled = false;
    } catch (e) {
      show(e.message, 'err');
      $('retry').hidden = false;
      if (liff.isInClient()) $('browser').hidden = false;
    }
  }

  /** 把照片縮小到最長邊 480 像素，減少上傳時間（看得出是誰就夠了） */
  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 480 / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(img.src);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => reject(new Error('照片讀取失敗，請再拍一次'));
      img.src = URL.createObjectURL(file);
    });
  }

  async function submit(file) {
    $('go').disabled = true;
    try {
      show('正在處理照片…');
      const photo = await shrinkPhoto(file);
      $('preview').src = photo; $('preview').hidden = false;
      const pos = await getPosition();
      show('正在送出打卡，大約 5 秒，請不要關閉…');
      const abort = new AbortController();
      const timer = setTimeout(() => abort.abort(), 40000);
      const res = await fetch(SYSTEM_URL, {
        method: 'POST', signal: abort.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'punch', kind, idToken: liff.getIDToken(), photo,
          lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: Math.round(pos.coords.accuracy),
        }),
      });
      const result = await res.json();
      clearTimeout(timer);
      show(result.message, result.ok ? 'ok' : 'err');
      if (result.ok) setTimeout(() => liff.isInClient() && liff.closeWindow(), 3000);
    } catch (e) {
      show(e.name === 'AbortError' ? '網路太慢，打卡沒有送出，請再按一次。' : (e.message || '打卡失敗，請再試一次'), 'err');
    } finally {
      $('go').disabled = false;
    }
  }

  $('go').addEventListener('click', () => $('camera').click());
  $('camera').addEventListener('change', (e) => { if (e.target.files[0]) submit(e.target.files[0]); e.target.value = ''; });
  $('retry').addEventListener('click', locate);
  // LINE 內建瀏覽器抓不到定位時，改用手機的 Safari／Chrome 開同一頁（一樣用 LINE 確認身分）
  $('browser').addEventListener('click', () => liff.openWindow({ url: location.href, external: true }));

  liff.init({ liffId: LIFF_ID }).then(() => {
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
    locate();
  }).catch(() => show('打卡頁啟動失敗，請從 LINE 官方帳號的按鈕開啟。', 'err'));
</script>
</body>
</html>
