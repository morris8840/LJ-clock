<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立隼打卡</title>
<style>
  :root { --brand: #c62828; --ok: #1a7f37; --muted: #666; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif; background: #f6f6f6; color: #222; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px; text-align: center; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .kind { font-size: 40px; font-weight: bold; color: var(--brand); margin: 12px 0; }
  .clock { font-size: 18px; color: var(--muted); margin-bottom: 24px; }
  button { width: 100%; padding: 18px; font-size: 20px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; }
  button:disabled { opacity: .5; }
  button.second { margin-top: 16px; background: #fff; color: var(--brand); border: 2px solid var(--brand); }
  [hidden] { display: none !important; }
  #status { margin-top: 20px; font-size: 17px; line-height: 1.6; white-space: pre-line; }
  .ok { color: var(--ok); font-weight: bold; } .err { color: var(--brand); font-weight: bold; }
  img { max-width: 60%; border-radius: 8px; margin-top: 12px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main>
  <h1>立隼企業 打卡</h1>
  <div class="kind" id="kind">打卡</div>
  <div class="clock" id="clock"></div>
  <button id="go" disabled>拍照並打卡</button>
  <input id="camera" type="file" accept="image/*" capture="user">
  <input id="dutyCam" type="file" accept="image/*" capture="environment">
  <img id="preview" alt="" hidden>
  <div id="status">載入中…</div>
  <button id="retry" class="second" hidden>重新定位</button>
  <p style="margin-top:32px;font-size:12px;color:#aaa">打卡頁版本 9</p>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // 這兩個值不是密碼，可以公開：LIFF ID 是打卡頁的編號，網址是系統收打卡資料的地方
  const LIFF_ID = '2012265965-rSm3NPmt';
  const SYSTEM_URL = 'https://script.google.com/macros/s/AKfycbwLEQq3Lt85fpw-4gh_jIRwsUOjT54pgJnM0urmRW3o5adaHWmzQs6q36Lzb8glUUv1/exec';
  const KINDS = { 上班: '上班打卡', 下班: '下班打卡', 外出: '中午外出', 回來: '中午回來' };

  const $ = (id) => document.getElementById(id);
  const kind = new URLSearchParams(location.search).get('kind') || '上班';
  $('kind').textContent = KINDS[kind] || '打卡';
  // 平常不用拍照；只有 GPS 抓不到、改用公司 Wi‑Fi 確認時才要自拍
  const MAX_GPS_ACCURACY = 200; // 和系統的 maxGpsAccuracyMeters 相同
  let usePhoto = false;
  function setPhotoMode(on) {
    usePhoto = on;
    $('go').textContent = on ? '拍照並打卡' : '確認打卡';
  }
  setPhotoMode(false);
  setInterval(() => { $('clock').textContent = new Date().toLocaleString('zh-TW', { hour12: false }); }, 1000);

  function show(text, cls) { $('status').className = cls || ''; $('status').textContent = text; }

  // 先確認位置、再拍照（iPhone 的 LINE 有時不給網頁 GPS，這時改用公司 Wi‑Fi 確認）
  let lastPos = null, posError = null, watchId = null;
  function keepBest(p) { if (!lastPos || p.coords.accuracy <= lastPos.coords.accuracy || Date.now() - lastPos.timestamp > 30000) lastPos = p; posError = null; }
  function keepError(e) { posError = e; }

  /** 向手機要定位：高精準＋粗略兩種同時要，哪個先回來先用 */
  function requestLocation() {
    if (!navigator.geolocation) return;
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(keepBest, keepError, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    navigator.geolocation.getCurrentPosition(keepBest, keepError, { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 });
  }

  /** 等定位：準度夠就馬上用；最多等 5 秒，抓不到就回傳 null，改用公司 Wi‑Fi 確認 */
  function getPosition() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      const started = Date.now();
      (function wait() {
        const sec = Math.floor((Date.now() - started) / 1000);
        if (lastPos && lastPos.coords.accuracy <= 100) return resolve(lastPos);
        if (sec >= 5 || (posError && posError.code === 1)) return resolve(lastPos);
        show('正在確認您在公司…（' + sec + ' 秒）');
        setTimeout(wait, 300);
      })();
    });
  }

  // 手機目前的網路位址：連著公司 Wi‑Fi 時會和公司的固定 IP 相同，GPS 抓不到時用它確認在公司
  const ipReady = fetch('https://api.ipify.org?format=json').then((r) => r.json()).then((d) => d.ip)
    .catch(() => fetch('https://www.cloudflare.com/cdn-cgi/trace').then((r) => r.text())
      .then((t) => (t.match(/^ip=(.+)$/m) || [])[1] || ''))
    .catch(() => '');

  /** 開啟頁面後先確認位置（GPS 優先，抓不到就用公司 Wi‑Fi），然後開放拍照按鈕 */
  async function locate() {
    $('go').disabled = true; $('retry').hidden = true;
    requestLocation();
    const pos = await getPosition();
    if (pos && pos.coords.accuracy <= MAX_GPS_ACCURACY) {
      setPhotoMode(false);
      show('定位完成 ✓（誤差約 ' + Math.round(pos.coords.accuracy) + ' 公尺）\n請按下方按鈕完成打卡。', 'ok');
    } else {
      setPhotoMode(true);
      show('手機定位抓不到，將改用「公司 Wi‑Fi」確認。\n請確認手機已連上公司 Wi‑Fi，再按下方按鈕拍一張自己的照片完成打卡。');
      $('retry').hidden = false;
    }
    $('go').disabled = false;
  }

  /** 把照片縮小到最長邊 480 像素，減少上傳時間（看得出是誰就夠了） */
  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 480 / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(img.src);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => reject(new Error('照片讀取失敗，請再拍一次'));
      img.src = URL.createObjectURL(file);
    });
  }

  async function submit(file) {
    $('go').disabled = true;
    try {
      let photo = '';
      if (file) {
        show('正在處理照片…');
        photo = await shrinkPhoto(file);
        $('preview').src = photo; $('preview').hidden = false;
      }
      const pos = lastPos || await getPosition();
      const ip = await ipReady;
      show('正在送出打卡，大約 5 秒，請不要關閉…');
      const abort = new AbortController();
      const timer = setTimeout(() => abort.abort(), 40000);
      const res = await fetch(SYSTEM_URL, {
        method: 'POST', signal: abort.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'punch', kind, idToken: liff.getIDToken(), photo, ip,
          lat: pos ? pos.coords.latitude : null, lng: pos ? pos.coords.longitude : null,
          accuracy: pos ? Math.round(pos.coords.accuracy) : null,
        }),
      });
      const result = await res.json();
      clearTimeout(timer);
      show(result.message, result.ok ? 'ok' : 'err');
      if (result.needPhoto) setPhotoMode(true);
      if (result.ok) setTimeout(() => liff.isInClient() && liff.closeWindow(), 3000);
    } catch (e) {
      show(e.name === 'AbortError' ? '網路太慢，打卡沒有送出，請再按一次。' : (e.message || '打卡失敗，請再試一次'), 'err');
    } finally {
      $('go').disabled = false;
    }
  }

  // ── 值日拍照模式（網址有 ?duty=工作編號）：照片自動印上「姓名 民國日期 時間 地點」──
  const dutyId = new URLSearchParams(location.search).get('duty');
  let duty = null;

  async function callSystem(payload) {
    const abort = new AbortController();
    const timer = setTimeout(() => abort.abort(), 60000);
    try {
      const res = await fetch(SYSTEM_URL, {
        method: 'POST', signal: abort.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ idToken: liff.getIDToken(), id: dutyId }, payload)),
      });
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function showDutyNext() {
    const n = duty.got;
    if (n >= duty.labels.length) {
      $('go').hidden = true;
      return;
    }
    $('kind').textContent = duty.labels[n];
    $('go').textContent = '拍照（第 ' + (n + 1) + '/' + duty.labels.length + ' 張）';
    $('go').hidden = false;
    $('go').disabled = false;
  }

  /** 縮到最長邊 1600 像素，左下角印上姓名、時間、地點（白字黑邊，任何背景都看得清楚） */
  function stampPhoto(file, text) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        let size = Math.round(canvas.width * 0.055);
        ctx.font = 'bold ' + size + 'px "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
        while (ctx.measureText(text).width > canvas.width * 0.92 && size > 12) {
          size -= 2;
          ctx.font = 'bold ' + size + 'px "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
        }
        const x = Math.round(canvas.width * 0.04);
        const y = Math.round(canvas.height - canvas.width * 0.05);
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(3, size / 6);
        ctx.strokeStyle = '#000';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = '#fff';
        ctx.fillText(text, x, y);
        URL.revokeObjectURL(img.src);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => reject(new Error('照片讀取失敗，請再拍一次'));
      img.src = URL.createObjectURL(file);
    });
  }

  function stampText(label) {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return duty.name + '  ' + (d.getFullYear() - 1911) + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '  ' + label;
  }

  async function submitDutyPhoto(file) {
    $('go').disabled = true;
    try {
      show('正在印上姓名、時間、地點…');
      const photo = await stampPhoto(file, stampText(duty.labels[duty.got]));
      $('preview').src = photo; $('preview').hidden = false;
      show('正在上傳照片，請不要關閉…');
      const result = await callSystem({ action: 'dutyPhoto', photo });
      show(result.message, result.ok ? 'ok' : 'err');
      if (result.ok) {
        duty.got = result.got;
        if (result.done) setTimeout(() => liff.isInClient() && liff.closeWindow(), 4000);
      }
    } catch (e) {
      show(e.name === 'AbortError' ? '網路太慢，照片沒有送出，請再拍一次。' : (e.message || '上傳失敗，請再試一次'), 'err');
    } finally {
      showDutyNext();
    }
  }

  async function startDuty() {
    document.querySelector('h1').textContent = '立隼企業 值日拍照';
    $('clock').hidden = true;
    $('go').disabled = true;
    show('載入工作中…');
    try {
      const info = await callSystem({ action: 'dutyPhotoInfo' });
      if (!info.ok) return show(info.message, 'err');
      duty = info;
      if (duty.got >= duty.labels.length) {
        $('kind').textContent = duty.title;
        $('go').hidden = true;
        return show('「' + duty.title + '」的照片已經收齊了 ✓', 'ok');
      }
      show(duty.title + '：共要拍 ' + duty.labels.length + ' 張\n照片會自動印上「' + duty.name + '、時間、地點」。');
      showDutyNext();
    } catch (e) {
      show('載入失敗，請關掉後從卡片重新按「拍照」。', 'err');
    }
  }

  $('go').addEventListener('click', () => (dutyId ? $('dutyCam').click() : usePhoto ? $('camera').click() : submit(null)));
  $('camera').addEventListener('change', (e) => { if (e.target.files[0]) submit(e.target.files[0]); e.target.value = ''; });
  $('dutyCam').addEventListener('change', (e) => { if (e.target.files[0]) submitDutyPhoto(e.target.files[0]); e.target.value = ''; });
  $('retry').addEventListener('click', locate);

  liff.init({ liffId: LIFF_ID }).then(() => {
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
    if (dutyId) return startDuty();
    locate();
  }).catch(() => show('打卡頁啟動失敗，請從 LINE 官方帳號的按鈕開啟。', 'err'));
</script>
</body>
</html>
